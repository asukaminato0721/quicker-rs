name: Linux
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Install native dependencies
        run: sudo apt-get update && sudo apt-get install -y libdbus-1-dev libxcb1-dev libx11-dev libxkbcommon-dev libgl1-mesa-dev xvfb xauth xdotool xterm imagemagick fonts-noto-cjk
      - run: cargo fmt --check
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo test --all-targets --locked
      - run: cargo check --target wasm32-unknown-unknown --lib --locked
      - run: cargo build --locked
      - run: python3 scripts/test-check-shared-action.py
      - run: xvfb-run -a -s '-screen 0 1280x900x24' python3 scripts/smoke-x11.py
      - run: xvfb-run -a -s '-screen 0 1280x900x24' python3 scripts/smoke-input-x11.py
      - run: xvfb-run -a -s '-screen 0 1280x900x24' python3 scripts/smoke-input-x11.py --key-operation
      - run: xvfb-run -a -s '-screen 0 1280x900x24' python3 scripts/smoke-input-x11.py --output-text
      - run: xvfb-run -a -s '-screen 0 1280x900x24' python3 scripts/smoke-input-x11.py --text-cancel
      - run: xvfb-run -a env -u WAYLAND_DISPLAY XDG_SESSION_TYPE=x11 cargo test key_operations_query_state -- --ignored
      - run: xvfb-run -a -s '-screen 0 1280x900x24' python3 scripts/smoke-plugin-editor-x11.py tests/fixtures/formula-image.json
      - run: xvfb-run -a cargo test clipboard_persists_after_action_worker_exits -- --ignored
      - run: xvfb-run -a cargo test x11_clipboard_events_include_identical_copies_and_exclude_primary -- --ignored
      - run: xvfb-run -a env -u WAYLAND_DISPLAY XDG_SESSION_TYPE=x11 cargo test focused_selection_rejects_primary_owned_by_another_window -- --ignored
      - run: xvfb-run -a env -u WAYLAND_DISPLAY XDG_SESSION_TYPE=x11 cargo test clipboard_wait_cancels_while_waiting -- --ignored
      - run: xvfb-run -a -s '-screen 0 1280x900x24' python3 scripts/smoke-clipboard-x11.py
      - run: xvfb-run -a env -u WAYLAND_DISPLAY XDG_SESSION_TYPE=x11 cargo test window_query_filters_before_focus_and_returns_window_metadata -- --ignored
      - run: xvfb-run -a -s '-screen 0 1280x900x24' python3 scripts/smoke-window-x11.py
